name = "BPLADetection"
license = "MIT"
version = "1.0.0"

[compat]
julia = "=1.13.3"

[deps]
# NOTE: ставим флаг `export JULIA_PKG_SERVER=""` потому-что CDN'ах стоят некоторые пакеты 
# пустые и качаем напрямую с GitHub единый точка правды пробавал брать с реестра зависимостей,
# но из-за внешних причин WI-FI качается битые зависимости/пакеты. Предварительно 
# битые папки удалять через `rm -rf ~/.julia/packages/**/**`, после запускаем Precompiled,
# ставим через `julia --project=. -e 'using Pkg; Pkg.instantiate()'`, 
# предварительно заново экспорт ставим флаг может перетиреться или пропасть.
# Под CDN имееться ввиду сленг с IT зеркала.
#
# Термин: 
# Зеркало - это прямой источник от автора альтернативные доставок данных, 
# но с другого сервра страны автора, при этом пользователь 
# получает те же данные которые хотел от автора источника.
#
# Источники зеркалов:
#
# |Иия поставишика   |  Источник поставишика (Зеркало)             |Причина                         |
# |------------------|---------------------------------------------|--------------------------------|
# |BFSU              | https://mirrors.bfsu.edu.cn/julia           | (Битые данные)                 |
# |TUNA              | https://mirrors.tuna.tsinghua.edu.cn/julia  | (Битые данные)                 |
# |SJTUG             | https://mirrors.sjtug.sjtu.edu.cn/julia     | (Не проверен)                  |
# |NJU               | https://mirrors.nju.edu.cn/julia            | (Не проверен)                  |
# |CERNET            | https://mirrors.cernet.edu.cn/julia	       | (Замедлен получим посткод 402) |
#
