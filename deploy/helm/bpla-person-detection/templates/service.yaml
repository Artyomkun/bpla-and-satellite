apiVersion: v1
kind: Service
metadata:
  name: {{ include "bpla-person-detection.fullname" . }}
  namespace: {{ .Values.global.namespace | default "bpla" }}
  labels:
    {{- include "bpla-person-detection.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.service.ports.metrics | quote }}
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.service.type }}
  ports:
    # Prometheus metrics
    - port: {{ .Values.service.ports.metrics }}
      targetPort: {{ .Values.service.ports.metrics }}
      protocol: TCP
      name: metrics
  
  selector:
    {{- include "bpla-person-detection.selectorLabels" . | nindent 4 }}