# ============================================================
# BPLA Person Detection - Docker Compose
# ============================================================
# Orchestrates multi-container deployment
# Called from: Makefile (root) -> docker-compose.yml -> Dockerfile
# ============================================================

services:
  # CPU-only detection service
  bpla-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: bpla-cpu
    ports:
      - "8000:8000"
      - "7860:7860"
    volumes:
      - ${PWD}/models:/app/models
      - ${PWD}/outputs:/app/outputs
      - ${PWD}/logs:/app/logs
    environment:
      - JULIA_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "julia", "-e", "using BPLADetection; @info \"Health check passed\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: bpla-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Prometheus metrics (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: bpla-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ${PWD}/deloy/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

volumes:
  redis-data:
