name: BPLA Person Detection CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bpla-person-detection
  JULIA_VERSION: '1.9'

jobs:
  # ========================================
  # CODE QUALITY
  # ========================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.quality.outputs.passed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: ${{ env.JULIA_VERSION }}
          project: bpla_person_detection

      - name: Cache Julia packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-julia-${{ hashFiles('**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-

      - name: Install Julia dependencies
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.add(["JuliaFormatter", "StaticArrays"])'

      - name: Check Julia formatting
        run: |
          julia --project -e '
            using JuliaFormatter
            format("bpla_person_detection"; verbose=true)
            @info "Checking formatting..."
            success(format("bpla_person_detection"; check=true)) || error("Formatting issues detected. Run JuliaFormatter.format(\"bpla_person_detection\") locally.")
          '

      - id: quality
        run: echo "passed=true" >> $GITHUB_OUTPUT

  # ========================================
  # UNIT TESTS WITH COVERAGE
  # ========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: ${{ env.JULIA_VERSION }}
          project: bpla_person_detection

      - name: Cache Julia packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-julia-${{ hashFiles('**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-

      - name: Run Julia tests with coverage
        run: |
          julia --project -e '
            using Pkg
            Pkg.add("Coverage")
            using Coverage
            Pkg.test(coverage=true)
            LCOV.writefile("lcov.info", process_folder())
          '

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ========================================
  # SECURITY SCANS
  # ========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run dependency review
        uses: actions/dependency-review-action@4901385134134e04cec5fbe5ddfe3b2c5bd5d976
        with:
          fail-on-severity: critical

  # ========================================
  # BUILD AND TEST DOCKER
  # ========================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and load Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: bpla_person_detection/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.run_id }}
          cache-to: type=gha,mode=max,scope=${{ github.run_id }}

      - name: Run Docker Scout
        uses: docker/scout-action@4bbf17a9da65a7b5497361bb407e88cc9548f69c
        with:
          command: quickview
          image: ${{ steps.meta.outputs.tags }}
          only-severities: critical,high

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ========================================
  # KUBERNETES VALIDATION
  # ========================================
  kubernetes-validation:
    name: Kubernetes Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: 'v1.29'

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: 'v3.14'

      - name: Lint Helm charts
        run: |
          helm lint helm/bpla-person-detection/

      - name: Validate Kubernetes manifests
        run: |
          if [ -d "kubernetes" ]; then
            kubectl apply --dry-run=client -f kubernetes/
          else
            echo "No kubernetes/ directory found, skipping"
          fi

      - name: Check Helm template rendering
        run: |
          helm template test-release helm/bpla-person-detection/ \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=latest \
            --debug

  # ========================================
  # DEPLOY TO STAGING (on main)
  # ========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker, kubernetes-validation]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.bpla.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: 'v1.29'

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: 'v3.14'

      - name: Login to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install bpla-staging helm/bpla-person-detection/ \
            --namespace bpla-staging \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=sha-$(git rev-parse --short HEAD) \
            --values helm/bpla-person-detection/values-staging.yaml \
            --wait \
            --timeout 5m

      - name: Health check
        run: |
          kubectl wait --for=condition=available \
            --timeout=300s \
            deployment/bpla-person-detection \
            -n bpla-staging

  # ========================================
  # DEPLOY TO PRODUCTION (on release tag)
  # ========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker, kubernetes-validation]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://bpla.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: 'v1.29'

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: 'v3.14'

      - name: Login to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PAT }}

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install bpla-production helm/bpla-person-detection/ \
            --namespace bpla-production \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.ref_name }} \
            --values helm/bpla-person-detection/values-production.yaml \
            --wait \
            --timeout 10m

      - name: Health check
        run: |
          kubectl wait --for=condition=available \
            --timeout=600s \
            deployment/bpla-person-detection \
            -n bpla-production

      - name: Create release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false